name: coroutine-study

on:
  push:
    paths:
      - "Coroutine_Study/**"
      - ".github/workflows/coroutine-study.yml"
  pull_request:
    paths:
      - "Coroutine_Study/**"
      - ".github/workflows/coroutine-study.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

defaults:
  run:
    working-directory: Coroutine_Study/exercises

jobs:
  docs-consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check presets, links, counts, and reference TODOs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root = Path.cwd()
          presets = json.loads((root / "CMakePresets.json").read_text(encoding="utf-8"))
          names = {p["name"] for p in presets["configurePresets"]}
          required = {
              "student", "verify-core", "full-windows", "full-linux-light",
              "heavy-folly-linux", "heavy-cobalt-linux",
              "default", "debug", "ninja", "ninja-debug", "vs2022", "vs2026",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"missing presets: {missing}")

          ordinary = sorted(
              p for p in root.iterdir()
              if p.is_dir() and re.fullmatch(r"[A-J]\d+_.+", p.name)
          )
          capstones = sorted(
              p for p in root.iterdir()
              if p.is_dir() and re.fullmatch(r"Capstone\d+_.+", p.name)
          )
          if len(ordinary) != 32 or len(capstones) != 3:
              raise SystemExit(
                  f"expected 32 ordinary exercises + 3 capstones; "
                  f"found {len(ordinary)} + {len(capstones)}"
              )
          missing_reference = [
              p.name for p in ordinary + capstones
              if not any(p.rglob("solution*.cpp")) and not (p / "reference").is_dir()
          ]
          if missing_reference:
              raise SystemExit(f"missing reference implementation: {missing_reference}")

          broken = []
          link_re = re.compile(r"\[[^\]]+\]\((?!https?://|#|mailto:)([^)]+)\)")
          for md in root.parent.rglob("*.md"):
              text = md.read_text(encoding="utf-8")
              text = re.sub(r"```.*?```", "", text, flags=re.DOTALL)
              text = re.sub(r"`[^`]*`", "", text)
              for raw in link_re.findall(text):
                  target = raw.split("#", 1)[0].strip().strip("<>")
                  if target and not (md.parent / target).exists():
                      broken.append(f"{md.relative_to(root.parent)} -> {raw}")
          if broken:
              raise SystemExit("broken links:\n" + "\n".join(broken))

          reference_files = list(root.rglob("solution*.cpp"))
          for ref_dir in root.rglob("reference"):
              if ref_dir.is_dir():
                  reference_files += [
                      p for p in ref_dir.rglob("*")
                      if p.is_file() and p.suffix in {".cpp", ".hpp", ".h"}
                  ]
          marker = re.compile(r"\b(?:TODO|NOT_IMPLEMENTED|fake)\b", re.IGNORECASE)
          offenders = [
              str(p.relative_to(root.parent))
              for p in reference_files
              if marker.search(p.read_text(encoding="utf-8", errors="ignore"))
          ]
          if offenders:
              raise SystemExit("unfinished marker in reference code:\n" + "\n".join(offenders))
          PY
      - name: Check stale global C++26 flags
        shell: bash
        run: |
          ! grep -R --line-number -E 'add_compile_options\(.*(-std=c\+\+2c|/std:c\+\+latest)' CMakeLists.txt cmake

  core-msvc:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure core
        run: cmake --preset verify-core
      - name: Build core
        run: cmake --build --preset verify-core -- /m:1
      - name: Test core
        run: ctest --preset verify-core -C Release

  core-gcc14:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
        working-directory: .
      - name: Configure core
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake --preset verify-core -G Ninja
      - name: Build core
        run: cmake --build --preset verify-core
      - name: Test core
        run: ctest --preset verify-core

  core-clang18:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y clang-18 g++-14 ninja-build
        working-directory: .
      - name: Configure core
        env:
          CC: clang-18
          CXX: clang++-18
          CXXFLAGS: --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14
        run: cmake --preset verify-core -G Ninja
      - name: Build core
        run: cmake --build --preset verify-core
      - name: Test core
        run: ctest --preset verify-core

  full-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Pin evidence
        run: |
          Select-String -Path cmake/ThirdPartySetup.cmake -Pattern "nvhpc-26.05","asio-1-38-2","8642e98596a92be30a2b061d3ed306d959d3214e"
      - name: Configure light deps
        run: cmake --preset full-windows
      - name: Build light deps
        run: cmake --build --preset full-windows -- /m:1
      - name: Test light deps
        run: ctest --test-dir build/full-windows -C Release --output-on-failure

  full-linux-light:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install base deps
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build pkg-config wget tar make
        working-directory: .
      - name: Build liburing 2.15
        shell: bash
        working-directory: .
        run: |
          wget -q https://github.com/axboe/liburing/archive/refs/tags/liburing-2.15.tar.gz -O /tmp/liburing-2.15.tar.gz
          tar -xf /tmp/liburing-2.15.tar.gz -C /tmp
          cd /tmp/liburing-liburing-2.15
          ./configure --prefix=/tmp/liburing-2.15
          make -j2
          make install
      - name: Pin evidence
        shell: bash
        env:
          PKG_CONFIG_PATH: /tmp/liburing-2.15/lib/pkgconfig:/tmp/liburing-2.15/lib64/pkgconfig
        run: |
          grep -E 'nvhpc-26.05|asio-1-38-2|8642e98596a92be30a2b061d3ed306d959d3214e' cmake/ThirdPartySetup.cmake
          pkg-config --modversion liburing
      - name: Configure light deps
        env:
          CC: gcc-14
          CXX: g++-14
          PKG_CONFIG_PATH: /tmp/liburing-2.15/lib/pkgconfig:/tmp/liburing-2.15/lib64/pkgconfig
        run: cmake --preset full-linux-light -G Ninja
      - name: Build light deps
        run: cmake --build --preset full-linux-light
      - name: Test light deps
        run: ctest --test-dir build/full-linux-light --output-on-failure

  heavy-folly-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Folly getdeps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fbcode_builder
            /tmp/fbcode_builder_getdeps-Z*
          key: folly-v2026.08.31.00-${{ runner.os }}
      - name: Install base deps
        run: sudo apt-get update && sudo apt-get install -y git python3 g++-14 ninja-build pkg-config wget tar make
        working-directory: .
      - name: Build liburing 2.15
        shell: bash
        working-directory: .
        run: |
          wget -q https://github.com/axboe/liburing/archive/refs/tags/liburing-2.15.tar.gz -O /tmp/liburing-2.15.tar.gz
          tar -xf /tmp/liburing-2.15.tar.gz -C /tmp
          cd /tmp/liburing-liburing-2.15
          ./configure --prefix=/tmp/liburing-2.15
          make -j2
          make install
      - name: Build Folly
        shell: bash
        working-directory: .
        run: |
          git clone --branch v2026.08.31.00 --depth 1 https://github.com/facebook/folly.git /tmp/folly
          python3 /tmp/folly/build/fbcode_builder/getdeps.py install-system-deps --recursive
          python3 /tmp/folly/build/fbcode_builder/getdeps.py build --allow-system-packages
          python3 /tmp/folly/build/fbcode_builder/getdeps.py show-inst-dir folly > /tmp/folly-prefix.txt
      - name: Pin evidence
        shell: bash
        env:
          PKG_CONFIG_PATH: /tmp/liburing-2.15/lib/pkgconfig:/tmp/liburing-2.15/lib64/pkgconfig
        run: |
          grep -E 'v2026.08.31.00|nvhpc-26.05|asio-1-38-2' ../../.github/workflows/coroutine-study.yml cmake/ThirdPartySetup.cmake
          pkg-config --modversion liburing
          cat /tmp/folly-prefix.txt
      - name: Configure Folly lane
        env:
          CC: gcc-14
          CXX: g++-14
          PKG_CONFIG_PATH: /tmp/liburing-2.15/lib/pkgconfig:/tmp/liburing-2.15/lib64/pkgconfig
        shell: bash
        run: cmake --preset heavy-folly-linux -G Ninja -DCMAKE_PREFIX_PATH="$(cat /tmp/folly-prefix.txt)"
      - name: Build Folly lane
        run: cmake --build --preset heavy-folly-linux
      - name: Test Folly lane
        run: ctest --test-dir build/heavy-folly-linux --output-on-failure

  heavy-cobalt-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Boost
        uses: actions/cache@v4
        with:
          path: |
            /tmp/boost_1_92_0
            /tmp/boost-1.92
          key: boost-1.92-${{ runner.os }}
      - name: Install base deps
        run: sudo apt-get update && sudo apt-get install -y wget tar g++-14 ninja-build pkg-config make
        working-directory: .
      - name: Build liburing 2.15
        shell: bash
        working-directory: .
        run: |
          wget -q https://github.com/axboe/liburing/archive/refs/tags/liburing-2.15.tar.gz -O /tmp/liburing-2.15.tar.gz
          tar -xf /tmp/liburing-2.15.tar.gz -C /tmp
          cd /tmp/liburing-liburing-2.15
          ./configure --prefix=/tmp/liburing-2.15
          make -j2
          make install
      - name: Build Boost.Cobalt
        shell: bash
        working-directory: .
        run: |
          if [ ! -x /tmp/boost_1_92_0/b2 ]; then
            wget -q https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.gz -O /tmp/boost_1_92_0.tar.gz
            tar -xf /tmp/boost_1_92_0.tar.gz -C /tmp
            cd /tmp/boost_1_92_0
            ./bootstrap.sh --prefix=/tmp/boost-1.92
          fi
          if [ ! -f /tmp/boost-1.92/lib/cmake/Boost-1.92.0/BoostConfig.cmake ]; then
            cd /tmp/boost_1_92_0
            ./b2 install --with-cobalt --with-system --with-context --with-coroutine --with-thread --with-chrono variant=release link=shared threading=multi
          fi
      - name: Pin evidence
        shell: bash
        env:
          PKG_CONFIG_PATH: /tmp/liburing-2.15/lib/pkgconfig:/tmp/liburing-2.15/lib64/pkgconfig
        run: |
          grep -E 'Boost 1.92|boost-1.92|nvhpc-26.05|asio-1-38-2' ../../.github/workflows/coroutine-study.yml cmake/ThirdPartySetup.cmake
          pkg-config --modversion liburing
          /tmp/boost_1_92_0/b2 --version
      - name: Configure Cobalt lane
        env:
          CC: gcc-14
          CXX: g++-14
          PKG_CONFIG_PATH: /tmp/liburing-2.15/lib/pkgconfig:/tmp/liburing-2.15/lib64/pkgconfig
        run: cmake --preset heavy-cobalt-linux -G Ninja -DCMAKE_PREFIX_PATH=/tmp/boost-1.92
      - name: Build Cobalt lane
        run: cmake --build --preset heavy-cobalt-linux
      - name: Test Cobalt lane
        run: ctest --test-dir build/heavy-cobalt-linux --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y clang-18 g++-14 ninja-build
        working-directory: .
      - name: Configure ASan/UBSan core
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake --preset verify-core -G Ninja
          -DCMAKE_CXX_FLAGS="--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14 -fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build ASan/UBSan core
        run: cmake --build --preset verify-core
      - name: Test ASan/UBSan core
        run: ctest --preset verify-core --timeout 60

  thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y clang-18 g++-14 ninja-build
        working-directory: .
      - name: Configure TSan core
        env:
          CC: clang-18
          CXX: clang++-18
        run: >
          cmake --preset verify-core -G Ninja -B build/tsan
          -DCMAKE_CXX_FLAGS="--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14 -O1 -g -fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build concurrency tests
        run: >
          cmake --build build/tsan --target
          mini_reference_sync_wait mini_reference_when_all
          mini_reference_when_any mini_reference_task_scope
      - name: Test TSan core
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: >
          ctest --test-dir build/tsan --output-on-failure --timeout 60
          -R '^mini_reference_(sync_wait|when_all|when_any|task_scope)$'
